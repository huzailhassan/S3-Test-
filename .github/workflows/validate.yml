name: Validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check files
        shell: bash
        run: |
          pwd
          ls -la

          echo "package.json files:"
          find . -type f -name "package.json" -print

          echo "schema.json files:"
          find . -type f -name "schema.json" -print

          echo "meta.json files:"
          find . -type f -name "meta.json" -print

      # ========================================
      # Validate JSON + Schema + MD5
      # ========================================
      - name: Validate config files
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "Step 1: Validate JSON syntax"
          echo "========================================"

          find . -type f \( -name "meta.json" -o -name "schema.json" \) |
          while IFS= read -r file
          do
            echo "Checking JSON: $file"
            jq empty "$file"
            echo "JSON OK: $file"
          done

          echo ""
          echo "========================================"
          echo "Step 2: Validate config files"
          echo "========================================"

          find . -type f -name "meta.json" |
          while IFS= read -r meta
          do
            dir=$(dirname "$meta")

            name=$(jq -r '.meta.name // empty' "$meta")
            file_name=$(jq -r '.meta.file_name // empty' "$meta")
            expected_md5=$(jq -r '.meta.md5 // empty' "$meta")

            echo ""
            echo "Meta: $meta"
            echo "Name: $name"
            echo "File: $file_name"
            echo "Expected MD5: $expected_md5"

            if [ -z "$name" ]; then
              echo "ERROR: meta.name is missing"
              exit 1
            fi

            if [ -z "$file_name" ]; then
              echo "ERROR: meta.file_name is missing"
              exit 1
            fi

            if [ -z "$expected_md5" ]; then
              echo "ERROR: meta.md5 is missing"
              exit 1
            fi

            target="$dir/$file_name"

            if [ ! -f "$target" ]; then
              echo "ERROR: File does not exist: $target"
              exit 1
            fi

            if [ ! -f "$dir/package.json" ]; then
              echo "ERROR: package.json is missing in $dir"
              exit 1
            fi

            if [ ! -f "$dir/schema.json" ]; then
              echo "ERROR: schema.json is missing in $dir"
              exit 1
            fi

            actual_md5=$(md5sum "$target" | awk '{print $1}')

            echo "Actual MD5: $actual_md5"

            if [ "$actual_md5" != "$expected_md5" ]; then
              echo "ERROR: MD5 verification FAILED"
              echo "Expected: $expected_md5"
              echo "Actual: $actual_md5"
              exit 1
            fi

            echo "MD5 verification PASSED"
            echo "Config validation PASSED"
          done

          echo ""
          echo "========================================"
          echo "ALL VALIDATIONS PASSED"
          echo "========================================"

      # ========================================
      # Configure AWS ONLY after validation
      # ========================================
      - name: Configure AWS
        if: github.event_name == 'push'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-west-2

      # ========================================
      # Check S3 names
      # ========================================
      - name: Check S3 names
        if: github.event_name == 'push'
        shell: bash
        env:
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
        run: |
          set -e

          echo "========================================"
          echo "Checking S3 names"
          echo "========================================"

          find . -type f -name "meta.json" |
          while IFS= read -r meta
          do
            name=$(jq -r '.meta.name // empty' "$meta")

            if [ -z "$name" ]; then
              echo "ERROR: meta.name is missing in $meta"
              exit 1
            fi

            s3_path="s3://$S3_BUCKET/$name/"

            echo ""
            echo "Checking: $s3_path"

            if aws s3 ls "$s3_path" --recursive | grep -q .
            then
              echo ""
              echo "ERROR: S3 name already exists!"
              echo "Name: $name"
              echo "Path: $s3_path"
              echo ""
              echo "Existing objects:"
              aws s3 ls "$s3_path" --recursive
              exit 1
            fi

            echo "S3 name is available: $name"
          done

          echo ""
          echo "All S3 names are available"

      # ========================================
      # Upload
      # ========================================
      - name: Upload to S3
        if: github.event_name == 'push'
        shell: bash
        env:
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
        run: |
          set -e

          echo "========================================"
          echo "Uploading to S3"
          echo "========================================"

          find . -type f -name "meta.json" |
          while IFS= read -r meta
          do
            dir=$(dirname "$meta")
            name=$(jq -r '.meta.name // empty' "$meta")

            s3_path="s3://$S3_BUCKET/$name"

            echo ""
            echo "Uploading: $name"

            aws s3 cp "$dir/package.json" "$s3_path/package.json"
            aws s3 cp "$dir/schema.json" "$s3_path/schema.json"
            aws s3 cp "$dir/meta.json" "$s3_path/meta.json"

            echo "Upload successful: $s3_path"
          done

          echo ""
          echo "========================================"
          echo "ALL UPLOADS COMPLETED"
          echo "========================================"
