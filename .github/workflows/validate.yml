name: Validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      # ========================================
      # Checkout
      # ========================================
      - name: Checkout
        uses: actions/checkout@v4

      # ========================================
      # 检查文件
      # ========================================
      - name: 检查文件
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "检查仓库文件"
          echo "========================================"

          pwd
          ls -la

          echo ""
          echo "最外层 package.json:"
          find . -maxdepth 1 -type f -name "package.json" -print

          echo ""
          echo "所有 schema.json:"
          find . -type f -name "schema.json" -print

          echo ""
          echo "所有 meta.json:"
          find . -type f -name "meta.json" -print

      # ========================================
      # 验证 JSON + name_s3 唯一性 + MD5
      # ========================================
      - name: 验证配置文件
        shell: bash
        run: |
          set -e

          # ========================================
          # 第一步：验证 JSON 格式
          # ========================================
          echo "========================================"
          echo "第一步：验证 JSON 格式"
          echo "========================================"

          find . -type f \( -name "meta.json" -o -name "schema.json" \) |
          while IFS= read -r file
          do
            echo "正在检查 JSON：$file"

            jq empty "$file"

            echo "JSON 格式正确：$file"
          done

          # ========================================
          # 第二步：检查 meta.name_s3 是否唯一
          # ========================================
          echo ""
          echo "========================================"
          echo "第二步：检查 meta.name_s3 是否唯一"
          echo "========================================"

          names=$(mktemp)

          find . -type f -name "meta.json" |
          while IFS= read -r meta
          do
            name_s3=$(jq -r '.meta.name_s3 // empty' "$meta")

            if [ -z "$name_s3" ]; then
              echo "错误：$meta 中缺少 meta.name_s3"
              rm -f "$names"
              exit 1
            fi

            echo "读取 name_s3：$name_s3"
            echo "$name_s3" >> "$names"
          done

          duplicate=$(sort "$names" | uniq -d)

          if [ -n "$duplicate" ]; then
            echo ""
            echo "========================================"
            echo "错误：发现重复的 meta.name_s3"
            echo "========================================"

            echo "$duplicate" |
            while IFS= read -r name_s3
            do
              echo ""
              echo "重复的 name_s3：$name_s3"

              find . -type f -name "meta.json" |
              while IFS= read -r meta
              do
                current=$(jq -r '.meta.name_s3 // empty' "$meta")

                if [ "$current" = "$name_s3" ]; then
                  echo "  -> $meta"
                fi
              done
            done

            echo ""
            echo "所有 meta.name_s3 必须唯一，校验终止。"

            rm -f "$names"
            exit 1
          fi

          rm -f "$names"

          echo ""
          echo "所有 meta.name_s3 均唯一"

          # ========================================
          # 第三步：验证配置文件
          # ========================================
          echo ""
          echo "========================================"
          echo "第三步：验证配置文件"
          echo "========================================"

          # 最外层必须存在 package.json
          if [ ! -f "./package.json" ]; then
            echo "错误：最外层缺少 package.json"
            exit 1
          fi

          echo "找到最外层 package.json：./package.json"

          find . -type f -name "meta.json" |
          while IFS= read -r meta
          do
            dir=$(dirname "$meta")

            echo ""
            echo "========================================"
            echo "正在验证：$meta"
            echo "所在目录：$dir"
            echo "========================================"

            name_s3=$(jq -r '.meta.name_s3 // empty' "$meta")
            name_git=$(jq -r '.meta.name_git // empty' "$meta")
            expected_md5=$(jq -r '.meta.md5 // empty' "$meta")

            echo "S3 名称：$name_s3"
            echo "Git 文件名：$name_git"
            echo "预期 MD5：$expected_md5"

            # ----------------------------------------
            # 检查 name_s3
            # ----------------------------------------
            if [ -z "$name_s3" ]; then
              echo "错误：$meta 中缺少 meta.name_s3"
              exit 1
            fi

            # ----------------------------------------
            # 检查 name_git
            # ----------------------------------------
            if [ -z "$name_git" ]; then
              echo "错误：$meta 中缺少 meta.name_git"
              exit 1
            fi

            # ----------------------------------------
            # 检查 md5
            # ----------------------------------------
            if [ -z "$expected_md5" ]; then
              echo "错误：$meta 中缺少 meta.md5"
              exit 1
            fi

            # ----------------------------------------
            # 检查配置文件
            # ----------------------------------------
            target="$dir/$name_git"

            echo "配置文件：$target"

            if [ ! -f "$target" ]; then
              echo "错误：找不到配置文件：$target"
              exit 1
            fi

            echo "配置文件存在"

            # ----------------------------------------
            # 检查 schema.json
            # ----------------------------------------
            if [ ! -f "$dir/schema.json" ]; then
              echo "错误：$dir 中缺少 schema.json"
              exit 1
            fi

            echo "schema.json 存在"

            # ----------------------------------------
            # 计算 MD5
            # ----------------------------------------
            actual_md5=$(md5sum "$target" | awk '{print $1}')

            echo "实际 MD5：$actual_md5"

            if [ "$actual_md5" != "$expected_md5" ]; then
              echo ""
              echo "========================================"
              echo "错误：MD5 校验失败"
              echo "========================================"

              echo "文件：$target"
              echo "预期：$expected_md5"
              echo "实际：$actual_md5"

              exit 1
            fi

            echo "MD5 校验通过"
            echo "配置验证通过"

          done

          echo ""
          echo "========================================"
          echo "所有配置验证通过"
          echo "========================================"

      # ========================================
      # 配置 AWS
      # ========================================
      - name: 配置 AWS
        if: github.event_name == 'push'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-west-2

      # ========================================
      # 检查 S3
      # ========================================
      - name: 检查 S3 名称
        if: github.event_name == 'push'
        shell: bash
        env:
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
        run: |
          set -e

          echo "========================================"
          echo "第四步：检查 S3 名称"
          echo "========================================"

          find . -type f -name "meta.json" |
          while IFS= read -r meta
          do
            name_s3=$(jq -r '.meta.name_s3 // empty' "$meta")

            if [ -z "$name_s3" ]; then
              echo "错误：$meta 中缺少 meta.name_s3"
              exit 1
            fi

            s3_path="s3://$S3_BUCKET/$name_s3/"

            echo ""
            echo "正在检查 S3：$s3_path"

            if aws s3 ls "$s3_path" --recursive | grep -q .
            then
              echo ""
              echo "========================================"
              echo "错误：S3 中已经存在这个 name_s3"
              echo "========================================"

              echo "name_s3：$name_s3"
              echo "S3 路径：$s3_path"

              echo ""
              echo "已经存在的文件："
              aws s3 ls "$s3_path" --recursive

              echo ""
              echo "为了防止覆盖已有配置，本次上传终止。"

              exit 1
            fi

            echo "S3 名称可用：$name_s3"

          done

          echo ""
          echo "========================================"
          echo "所有 S3 名称均可用"
          echo "========================================"

      # ========================================
      # 上传 S3
      # ========================================
      - name: 上传配置到 S3
        if: github.event_name == 'push'
        shell: bash
        env:
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
        run: |
          set -e

          echo "========================================"
          echo "第五步：上传配置到 S3"
          echo "========================================"

          find . -type f -name "meta.json" |
          while IFS= read -r meta
          do
            dir=$(dirname "$meta")
            name_s3=$(jq -r '.meta.name_s3 // empty' "$meta")
            name_git=$(jq -r '.meta.name_git // empty' "$meta")

            s3_path="s3://$S3_BUCKET/$name_s3"

            echo ""
            echo "========================================"
            echo "正在上传配置"
            echo "========================================"

            echo "S3 名称：$name_s3"
            echo "Git 文件名：$name_git"
            echo "目标：$s3_path"

            # ----------------------------------------
            # 上传 package.json
            # ----------------------------------------
            echo "上传 package.json..."

            aws s3 cp \
              "./package.json" \
              "$s3_path/package.json"

            # ----------------------------------------
            # 上传 schema.json
            # ----------------------------------------
            echo "上传 schema.json..."

            aws s3 cp \
              "$dir/schema.json" \
              "$s3_path/schema.json"

            # ----------------------------------------
            # 上传 meta.json
            # ----------------------------------------
            echo "上传 meta.json..."

            aws s3 cp \
              "$dir/meta.json" \
              "$s3_path/meta.json"

            # ----------------------------------------
            # 上传配置文件
            # ----------------------------------------
            target="$dir/$name_git"

            echo "上传配置文件：$name_git..."

            aws s3 cp \
              "$target" \
              "$s3_path/$name_git"

            echo ""
            echo "上传成功：$s3_path"

          done

          echo ""
          echo "========================================"
          echo "所有配置上传完成"
          echo "========================================"