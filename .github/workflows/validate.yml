name: Validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check files
        run: |
          pwd
          ls -la
          find . -name "package.json" -print
          find . -name "schema.json" -print
          find . -name "meta.json" -print

      - name: Install dependencies
        run: npm install

      - name: Validate config files
        shell: bash
        run: |
          set -e

          echo "Searching for schema.json files..."

          find . -type f -name "schema.json" | while read -r schema; do
            dir=$(dirname "$schema")

            echo ""
            echo "========================================"
            echo "Schema: $schema"
            echo "Directory: $dir"
            echo "========================================"

            # your validation logic here
          done
